<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .resize {
        text-overflow: clip;
        font-size: 1em;
        color: azure;
        font-family: sans-serif;
        transition:
          width 5s cubic-bezier(0.25, 0.1, 0.25, 1.4) 0s,
          height 5s cubic-bezier(0.25, 0.1, 0.25, 1.4) 0s,
          font-size 5s cubic-bezier(0.25, 0.1, 0.25, 1.4) 0s,
          background-color 5s ease-out,
          color 1s step-end;
      }
      .resize:hover {
        width: 70%;
        height: 150px;
        font-size: 2em;
        color: aqua;
        font-weight: bold;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="resize">Hello World...</div>
  </body>
</html>
