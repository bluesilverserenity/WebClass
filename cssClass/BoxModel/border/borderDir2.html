<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .myDiv {
            width: 500px;
            height: 500px;
            background-color: #f8f8ff;
            border-top-width: 3px;
            border-top-style: groove;
            border-top-color: #efefef;

            border-right-width: 4px;
            border-right-style: dotted;
            border-right-color: rgb(255, 100, 130);

            border-bottom-width: 1px;
            border-bottom-style: dashed;
            border-bottom-color: rgb(200, 130, 130);

            border-left-width: 7px;
            border-left-style: solid;
            border-left-color: rgb(100, 100, 200);

            border-radius: 50%;
        }

        .myDiv p {
            padding-top: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
            padding-left: 50px;
            padding: 20px;      /* all sides */     
            margin-top: 50px;
            margin-right: 50px;
            margin-bottom: 50px;
            margin-left: 50px;
            padding: 20px;      /* all sides */     
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="myDiv">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi obcaecati, quam nulla excepturi aut earum cumque necessitatibus ipsa est, reiciendis quia quod ex minima dolorum rerum perferendis sequi iure voluptas.</p>
    </div>
</body>
</html>
