<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="hello.java" method="get" name="empForm">
      <label for="name">Full Name</label>
      <input
        type="text"
        name="fullName"
        id=""
        required
        maxlength="45"
        minlength="4"
        placeholder="Enter your full name"
      /> <br><br>
      <label for="age">Age</label>
      <input
        type="number"
        name="age"
        min="18"
        max="50"
        id=""
        required
      /> <br><br>

      <label for="">DOB</label>
      <input type="date" name="" required id="" />
      <br><br>

      <label for="email">Email</label>
      <input type="email" name="Email" id="">
      <br><br>

      <label for="">Phone Number</label>
      <input type="tel" name="phoneNumber" id="">
      <br><br>

      <label for="">Password</label>
      <input type="password" name="password" id="">
      <br><br>

      <label for="">Upload Picture</label>
      <input type="file" name="" id="">
      <br><br>

      <label for="">Gender</label>
      <p>Male ::: <input type="radio" name="gender" id="Male" value="male" checked></p>
      <p>Female ::: <input type="radio" name="gender" id="Female" value="female"></p>

      <label for="">Hobbies</label>
      <p>Gaming ::: <input type="checkbox" name="hobbies" id="" value="gaming" checked readonly disabled></p>
      <p>Reading ::: <input type="checkbox" name="hobbies" id="" value="reading" checked readonly disabled></p>
      <p>Traveling ::: <input type="checkbox" name="hobbies" id="" value="traveling"></p>
      <p>Watching Movies ::: <input type="checkbox" name="hobbies" id="" value="watchingMovies"></p>
      <p>Eating ::: <input type="checkbox" name="hobbies" id="" value="eating"></p>

  </body>
</html>
