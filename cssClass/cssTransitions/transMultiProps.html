<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        background-color: antiquewhite;
        height: 100px;
        font-size: 50px;
        align-content: center;
        color: aquamarine;
        transition-property:
          width, height, font-size, transform, letter-spacing, color,
          font-family;
        transition-duration: 20s;
      }

      div:hover {
        width: 100%;
        height: 100%;
        letter-spacing: 50px;
        font-size: 50px;
        transform: rotate(360deg);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>We are Culers</h1>
    </div>
  </body>
</html>
