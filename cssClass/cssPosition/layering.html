<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        position: relative;
      }

      .box {
        width: 150px;
        height: 150px;
        opacity: 0.9;
        position: absolute;
      }

      .red {
        background: red;
        z-index: 1;
      }

      .green {
        top: 30px;
        left: 30px;
        background: rgb(38, 199, 38);
        z-index: 2;
      }

      .blue {
        top: 60px;
        left: 60px;
        background: rgb(28, 7, 122);
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box red"></div>
      <div class="box green"></div>
      <div class="box blue"></div>
    </div>
  </body>
</html>
