<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        border: 1px solid green;
        padding: 10px;
        text-align: center;
      }

      p#grab {
        cursor: grab;
      }
      p#point {
        cursor: pointer;
      }
      p#ne {
        cursor: not-allowed;
      }
      p#def {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <p id="grab">Cursor :: Grab</p>
    <p id="point">Cursor :: Pointer</p>
    <p id="ne">Cursor :: Not Allowed</p>
    <p id="def">Cursor :: Default</p>
  </body>
</html>
