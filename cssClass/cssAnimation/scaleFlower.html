<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        width: 200px;
        position: relative;
        left: 500px;
        top: 200px;
        animation-name: flower;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
        animation-delay: 2s;
      }
      @keyframes flower {
        from {
          transform: scale(4);
        }
      }
    </style>
  </head>
  <body>
    <img src="./image/love2.jfif" alt="beating heart" />
  </body>
</html>
