<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px;
      }

      form {
        border: 2px solid gray;
        width: 300px;
        padding: 10px;
        border-radius: 10px;
        background: azure;
      }

      input[type="button"] {
        background-color: rgb(8, 8, 112);
        color: azure;
        border: none;
        padding: 8px;
        border-radius: 4px;
        width: 80%;
        display: block;
        margin: 0 auto;
      }

      h3 {
        text-align: center;
        padding-bottom: 10px;
        font-size: x-large;
      }

      a {
        text-align: center;
        display: block;
      }

      label {
        font-weight: bolder;
        font-size: 18px;
      }

      .input {
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form action="">
        <h3>Login</h3>

        <div>
          <label for="">User Name:</label>
          <input class="input" type="text" required />
        </div>
        <br />

        <div>
          <label for="">Password:</label>
          <input class="input" type="password" required /> <br /><br />
        </div>

        <input type="button" value="Login" /> <br /><br />

        <a href="">Forget Password?</a>
      </form>
    </div>
  </body>
</html>
